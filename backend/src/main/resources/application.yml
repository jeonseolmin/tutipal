server:
  port: 8080
  tomcat:
    max-part-header-size: 2KB           # 업로드 파일 이름이 한글 200자(600바이트+)여도 받게. 기본 512B 면 긴 한글 이름이 413
  forward-headers-strategy: framework   # Cloudflare Tunnel 뒤: https 판단 → 리다이렉트 URI · 세션 쿠키 Secure

spring:
  application:
    name: tutipal
  threads:
    virtual:
      enabled: true                     # 요청 · @Async · 스케줄러를 가상 스레드로

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_HOST_PORT:5433}/tutipal}
    username: ${POSTGRES_USER:tutipal}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate                # 스키마는 Flyway(db/migration) 가 만든다, 엔티티와 다르면 기동 실패
    open-in-view: false
  flyway:
    baseline-on-migrate: true           # 1단계 DB(ddl-auto 로 만든 users)는 V1 을 건너뛰고 V2 부터
    baseline-version: 1

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:}
  servlet:
    multipart:                          # 자료 업로드 10MB (MaterialService.MAX_BYTES 와 같게)
      max-file-size: 10MB
      max-request-size: 11MB
  session:
    timeout: 2h                         # 유휴 제한. 절대 12시간은 SessionAbsoluteTimeoutFilter (Redis 저장)

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: [profile, email]
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: [name, email]
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-name: Kakao
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: [profile_nickname, account_email]
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

app:
  dev-login: ${DEV_LOGIN:false}          # 로컬 테스트용 로그인. 공개 서버에서는 반드시 false
  ai:
    base-url: ${AI_BASE_URL:http://localhost:8000}
    internal-key: ${AI_INTERNAL_KEY:}
    max-concurrent: ${AI_MAX_CONCURRENT:2}   # 동시에 LLM 을 부르는 수 (GPU 하나 보호)
    wait-for-slot: 30s
  livekit:                                # 화면공유 입장권(JWT) 서명 키 = docker-compose 의 livekit 과 같은 값 (.env)
    api-key: ${LIVEKIT_API_KEY:}
    api-secret: ${LIVEKIT_API_SECRET:}
    public-url: ${LIVEKIT_PUBLIC_URL:ws://localhost:7880}   # 앱/브라우저가 접속하는 LiveKit 주소
