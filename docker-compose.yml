services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"   # 로컬 개발(bootRun)용, 이 PC 안에서만
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  ai:
    build: ./ai
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"   # 외부 비공개, 로컬 개발용

  backend:
    # React 화면까지 함께 빌드해서 Spring 이 화면 + API 를 한 주소로 제공 (nginx 없음)
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    ports:
      - "80:8080"   # Electron 기본 주소 http://localhost. 공개 시연은 Cloudflare Tunnel 이 HTTPS 를 맡음
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      AI_BASE_URL: http://ai:8000
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      ai: { condition: service_started }
    restart: unless-stopped

  livekit:
    # 화면공유 SFU (방 A: 선생님 → 전체, 방 B: 학생 → 선생님 1:1). 입장권은 backend 가 발급
    image: livekit/livekit-server:v1.9.1
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "${LIVEKIT_NODE_IP:-127.0.0.1}"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"          # 접속(WebSocket 신호). 입장권 없이는 아무것도 못 함
      - "7881:7881"          # 영상 TCP (UDP 가 막힌 경우)
      - "7882:7882/udp"      # 영상 UDP
    restart: unless-stopped

volumes:
  db-data:
  redis-data:
