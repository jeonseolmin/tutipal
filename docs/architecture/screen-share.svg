<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1290" viewBox="0 0 1400 1290" font-family="'Malgun Gothic','Segoe UI',sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
    <style>
      .h{font-size:20px;font-weight:800;fill:#0f172a}
      .s{font-size:13.5px;fill:#334155}
      .m{font-size:12px;fill:#64748b}
      .b{font-weight:800}
      .bt{font-size:15px;font-weight:800}
      .ar{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}
      .bl{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#g)}
      .or{stroke:#d97706;stroke-width:3;fill:none;marker-end:url(#o)}
      .lf{stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 5}
      .n{font-size:12px;font-weight:800;fill:#fff}
    </style>
  </defs>
  <rect width="1400" height="1290" fill="#f8fafc"/>
  <text x="40" y="52" font-size="30" font-weight="800" fill="#0f172a">실시간 화면공유 — 양방향 (강사 ⇄ 학생)</text>
  <text x="40" y="82" class="s">무료 오픈소스 LiveKit(Apache 2.0)을 EC2 에 직접 띄우고, 누가 보고 누가 올릴지는 Spring 이 입장 토큰으로 정함</text>

  <!-- ① overall -->
  <rect x="40" y="105" width="1320" height="400" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="62" y="140" class="h">① 전체 구조 — 방(Room) 두 종류</text>
  <g class="s">
    <line x1="80" y1="160" x2="104" y2="160" class="bl"/><text x="112" y="165">A. 강의 화면: 강사 → 학생 전체 (1:N)</text>
    <line x1="430" y1="160" x2="454" y2="160" class="or"/><text x="462" y="165">B. 도움 요청: 학생 → 강사 (1:1, 강사 승인 후)</text>
  </g>

  <!-- instructor -->
  <rect x="70" y="200" width="200" height="120" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="170" y="232" text-anchor="middle" class="bt" fill="#1e3a8a">👩‍🏫 강사</text>
  <text x="170" y="256" text-anchor="middle" class="m">웹 브라우저 또는 Electron</text>
  <text x="170" y="278" text-anchor="middle" class="m">내 화면 올리기 (1번)</text>
  <text x="170" y="298" text-anchor="middle" class="m">학생 화면 보기 (승인한 것만)</text>

  <!-- livekit -->
  <rect x="470" y="190" width="420" height="290" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="680" y="214" text-anchor="middle" class="s b">LiveKit 중계 서버 (SFU) · EC2 · Docker</text>
  <rect x="495" y="228" width="370" height="96" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="680" y="256" text-anchor="middle" class="bt" fill="#1e3a8a">방 A · course-12</text>
  <text x="680" y="280" text-anchor="middle" class="m">강사: 올리기 O · 학생: 보기만</text>
  <text x="680" y="300" text-anchor="middle" class="m">강사 화면 1개 → 서버가 50명에게 복사</text>
  <rect x="495" y="340" width="175" height="120" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="582" y="366" text-anchor="middle" font-size="13.5" class="b" fill="#92400e">방 B · help-12-7</text>
  <text x="582" y="388" text-anchor="middle" class="m">학생7: 올리기</text>
  <text x="582" y="406" text-anchor="middle" class="m">강사: 보기</text>
  <text x="582" y="428" text-anchor="middle" class="m">다른 학생 입장 불가</text>
  <rect x="690" y="340" width="175" height="120" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="777" y="366" text-anchor="middle" font-size="13.5" class="b" fill="#92400e">방 B · help-12-31</text>
  <text x="777" y="388" text-anchor="middle" class="m">학생31: 올리기</text>
  <text x="777" y="406" text-anchor="middle" class="m">강사: 보기</text>
  <text x="777" y="428" text-anchor="middle" class="m">동시 최대 4개</text>

  <!-- students -->
  <rect x="1090" y="200" width="240" height="70" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1210" y="230" text-anchor="middle" class="bt">🧑‍🎓 학생 1 ~ 50</text>
  <text x="1210" y="252" text-anchor="middle" class="m">Electron 앱 · 강의 화면 시청</text>
  <rect x="1090" y="350" width="240" height="70" rx="12" fill="#fff" stroke="#d97706" stroke-width="2"/>
  <text x="1210" y="380" text-anchor="middle" class="bt">🧑‍🎓 학생 7 · 31</text>
  <text x="1210" y="402" text-anchor="middle" class="m">"화면 보여주기" 승인받은 학생</text>

  <!-- arrows -->
  <path class="bl" d="M270,250 L491,265"/>
  <path class="bl" d="M865,265 L1086,240"/>
  <path class="or" d="M1086,385 L870,400"/>
  <path class="or" d="M495,356 L410,356 L276,306"/>

  <!-- spring -->
  <rect x="70" y="370" width="300" height="112" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="220" y="398" text-anchor="middle" class="bt" fill="#1e3a8a">Spring (Java 21)</text>
  <text x="220" y="420" text-anchor="middle" class="m">수강생·강사 확인 → LiveKit 입장 토큰 발급</text>
  <text x="220" y="440" text-anchor="middle" class="m">(io.livekit:livekit-server SDK)</text>
  <text x="220" y="462" text-anchor="middle" class="m">요청·승인 알림 = 기존 WebSocket(STOMP)</text>
  <text x="940" y="470" class="m">Redis 는 기존 것 공유 (LiveKit 방 정보 저장)</text>

  <!-- ② permission table -->
  <rect x="40" y="525" width="650" height="290" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="62" y="560" class="h">② 권한 — Spring 이 토큰에 적는 내용</text>
  <rect x="62" y="574" width="606" height="32" rx="6" fill="#f1f5f9"/>
  <g font-size="13.5" font-weight="800"><text x="76" y="595">방</text><text x="230" y="595">사람</text><text x="340" y="595">올리기</text><text x="430" y="595">보기</text><text x="510" y="595">조건</text></g>
  <g class="s">
    <text x="76" y="636">A course-{id}</text><text x="230" y="636">강사</text><text x="340" y="636" fill="#059669" class="b">화면 O</text><text x="430" y="636">O</text><text x="510" y="636">그 강의 담당</text>
    <text x="76" y="668">A course-{id}</text><text x="230" y="668">학생</text><text x="340" y="668" fill="#b91c1c" class="b">X</text><text x="430" y="668">O</text><text x="510" y="668">수강 등록생</text>
    <text x="76" y="700">B help-{id}-{학생}</text><text x="230" y="700">그 학생</text><text x="340" y="700" fill="#059669" class="b">화면 O</text><text x="430" y="700">X</text><text x="510" y="700">강사 승인 후</text>
    <text x="76" y="732">B help-{id}-{학생}</text><text x="230" y="732">강사</text><text x="340" y="732" fill="#b91c1c" class="b">X</text><text x="430" y="732">O</text><text x="510" y="732">승인한 강사만</text>
  </g>
  <g stroke="#e2e8f0"><line x1="62" y1="648" x2="668" y2="648"/><line x1="62" y1="680" x2="668" y2="680"/><line x1="62" y1="712" x2="668" y2="712"/></g>
  <text x="62" y="770" class="s"><tspan class="b">왜 방을 나누나?</tspan> 한 방에 두면 학생 화면이 다른 학생에게</text>
  <text x="62" y="792" class="s">보일 위험 → 1:1 전용 방이면 구조적으로 차단 (개인정보)</text>

  <!-- ③ help sequence -->
  <rect x="710" y="525" width="650" height="290" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="732" y="560" class="h">③ 학생 → 강사 "화면 보여주기" 흐름</text>
  <g>
    <rect x="760" y="575" width="120" height="30" rx="6" fill="#64748b"/><text x="820" y="595" text-anchor="middle" class="n">학생 앱</text>
    <rect x="975" y="575" width="120" height="30" rx="6" fill="#3b82f6"/><text x="1035" y="595" text-anchor="middle" class="n">Spring</text>
    <rect x="1190" y="575" width="120" height="30" rx="6" fill="#1e3a8a"/><text x="1250" y="595" text-anchor="middle" class="n">강사</text>
  </g>
  <line class="lf" x1="820" y1="605" x2="820" y2="800"/><line class="lf" x1="1035" y1="605" x2="1035" y2="800"/><line class="lf" x1="1250" y1="605" x2="1250" y2="800"/>
  <g font-size="12.5" fill="#0f172a" font-weight="600">
    <circle cx="740" cy="628" r="10" fill="#d97706"/><text x="740" y="632" text-anchor="middle" class="n">1</text>
    <path class="ar" d="M820,632 L1031,632"/><text x="830" y="624">"화면 보여주기" 요청</text>
    <path class="ar" d="M1035,652 L1246,652"/><text x="1045" y="646">STOMP 알림</text>
    <circle cx="740" cy="684" r="10" fill="#d97706"/><text x="740" y="688" text-anchor="middle" class="n">2</text>
    <path class="ar" d="M1250,688 L1039,688"/><text x="1060" y="680">강사 "수락"</text>
    <circle cx="740" cy="722" r="10" fill="#d97706"/><text x="740" y="726" text-anchor="middle" class="n">3</text>
    <path class="ar" d="M1035,722 L824,722"/><text x="845" y="714">방B 올리기 토큰</text>
    <path class="ar" d="M1035,742 L1246,742"/><text x="1045" y="736">방B 보기 토큰</text>
    <circle cx="740" cy="776" r="10" fill="#d97706"/><text x="740" y="780" text-anchor="middle" class="n">4</text>
    <text x="760" y="780">학생이 화면/창 고름 → 강사에게만 보임 · "종료" 시 방 삭제</text>
  </g>

  <!-- ④ choices + cost -->
  <rect x="40" y="835" width="650" height="215" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="62" y="870" class="h">④ 무료 오픈소스 후보</text>
  <g class="s">
    <text x="62" y="902"><tspan class="b" fill="#059669">★ LiveKit</tspan> (Apache 2.0) — Docker 한 줄 · Java SDK · React 컴포넌트</text>
    <text x="62" y="928"><tspan class="b">OpenVidu 3</tspan> (Apache 2.0) — LiveKit 기반, 기능 많고 무거움</text>
    <text x="62" y="954"><tspan class="b">Jitsi</tspan> (Apache 2.0) — 완성된 회의 앱, 우리 화면에 넣기 어려움</text>
    <text x="62" y="980"><tspan class="b">mediasoup</tspan> (ISC) — 유연하지만 Node 서버 직접 작성</text>
    <text x="62" y="1006"><tspan class="b">Janus</tspan> (GPL v3) — 안정적, 라이선스·설정 부담</text>
    <text x="62" y="1034" class="m">화면 캡처: Electron = setDisplayMediaRequestHandler + desktopCapturer · 웹 = getDisplayMedia</text>
  </g>

  <rect x="710" y="835" width="650" height="215" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="2"/>
  <text x="732" y="870" class="h">⑤ 무료지만 알아둘 비용 · 제약</text>
  <g class="s">
    <text x="732" y="902">• <tspan class="b">트래픽</tspan>: 강의 화면 1.5Mbps × 50명 ≈ <tspan class="b">1시간 30GB+</tspan></text>
    <text x="748" y="924" class="m">AWS 는 나가는 트래픽 과금 → 가장 큰 비용. 학생→강사(1:1)는 작음</text>
    <text x="732" y="954">• EC2 보안 그룹에서 <tspan class="b">UDP 포트 범위</tspan> 열기 (TURN 은 LiveKit 내장)</text>
    <text x="732" y="982">• 50명 동시면 t3.medium 보다 한 단계 큰 인스턴스 권장</text>
    <text x="732" y="1010">• 학생 화면은 동시 4개 정도로 제한 (강사 PC · 회선 보호)</text>
    <text x="732" y="1036" class="m">LiveKit Cloud 무료 구간도 있지만 한도 초과 시 유료 · 외부 의존</text>
  </g>

  <!-- ⑥ summary -->
  <rect x="40" y="1070" width="1320" height="200" rx="14" fill="#0f172a"/>
  <text x="62" y="1105" font-size="20" font-weight="800" fill="#fff">📌 요약</text>
  <g font-size="14" fill="#e2e8f0">
    <text x="62" y="1138">1. 화면공유 기술(WebRTC)은 브라우저·Electron 기본 기능 — 1:50 은 중계 서버(SFU)가 필요하고, <tspan fill="#6ee7b7" font-weight="800">LiveKit 을 무료로 직접 운영</tspan>합니다.</text>
    <text x="62" y="1166">2. <tspan fill="#93c5fd" font-weight="800">강사 → 학생</tspan>: 강의 방(A)에 강사만 화면을 1번 올리고 서버가 50명에게 나눠 보냄.</text>
    <text x="62" y="1194">3. <tspan fill="#fcd34d" font-weight="800">학생 → 강사</tspan>: 요청 → 강사 승인 → 1:1 전용 방(B). 다른 학생은 구조적으로 못 봄. 요청·승인 알림은 기존 STOMP.</text>
    <text x="62" y="1222">4. 권한은 Spring 이 토큰으로 결정(올리기/보기) → 규칙이 우리 서버에 남음. Redis 는 기존 것 공유.</text>
    <text x="62" y="1250">5. 추가 공수 ≈ <tspan font-weight="800" fill="#fff">10~12 인일</tspan> (한 방향 6~8 + 요청·승인·1:1 방 4) · 가장 큰 비용은 EC2 나가는 트래픽.</text>
  </g>
</svg>
