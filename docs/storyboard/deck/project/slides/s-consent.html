<h3>설명</h3>
<p>캐릭터가 볼 창을 학생이 직접 고른다. 데스크톱 앱에서만 열린다.</p>
<h3>주요 요소</h3>
<ol>
<li>약속 3가지: 고른 창만 · 이미지 저장 안 함 · 언제든 끄기</li>
<li>열린 창 목록 (미리보기)</li>
<li>켜기 / 이 창으로 바꾸기 / 끄기</li>
</ol>
<h3>이동</h3>
<p>켜기 → 홈, 위젯이 요약 시작</p>
