<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1120" viewBox="0 0 1400 1120" font-family="'Malgun Gothic','Segoe UI',sans-serif">
  <defs>
    <style>
      .h{font-size:20px;font-weight:800;fill:#0f172a}
      .s{font-size:13.5px;fill:#334155}
      .m{font-size:12px;fill:#64748b}
      .b{font-weight:800}
      .v{font-size:13px;font-weight:800;fill:#0f172a}
      .t{fill:#f59e0b}.e{fill:#475569}
    </style>
  </defs>
  <rect width="1400" height="1120" fill="#f8fafc"/>
  <text x="40" y="52" font-size="30" font-weight="800" fill="#0f172a">Tauri 2 vs Electron — 근거로 비교하기</text>
  <text x="40" y="82" class="s"><tspan font-weight="800" fill="#059669">결정: Electron + TypeScript</tspan> · 숫자는 공식 출처(npm 공식 통계 API · GitHub API · 공식 문서 · State of JS) 기준, 2026-11-16 조회</text>
  <g class="s"><rect x="1080" y="62" width="16" height="16" rx="3" class="t"/><text x="1102" y="75">Tauri</text><rect x="1160" y="62" width="16" height="16" rx="3" class="e"/><text x="1182" y="75">Electron</text></g>

  <!-- ① npm downloads -->
  <rect x="40" y="105" width="650" height="300" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="62" y="140" class="h">① 실제 사용량 — npm 월간 다운로드</text>
  <text x="62" y="162" class="m">10월 한 달 기준 · Tauri = @tauri-apps/api · CI·자동 빌드 포함이라 "추세"로 보기</text>
  <!-- scale: 37.6M = 420px -->
  <text x="62" y="200" class="s b">2025년 10월</text>
  <rect x="170" y="186" width="85" height="20" rx="4" class="e"/><text x="262" y="201" class="v">758만</text>
  <rect x="170" y="210" width="14" height="20" rx="4" class="t"/><text x="191" y="225" class="v">122만</text>
  <text x="62" y="272" class="s b">2026년 10월</text>
  <rect x="170" y="258" width="420" height="20" rx="4" class="e"/><text x="597" y="273" class="v">3,761만</text>
  <rect x="170" y="282" width="153" height="20" rx="4" class="t"/><text x="330" y="297" class="v">1,372만</text>
  <rect x="62" y="322" width="606" height="66" rx="8" fill="#fffbeb"/>
  <text x="76" y="346" class="s">1년 성장률: Electron <tspan class="b">×5.0</tspan> · Tauri <tspan class="b" fill="#d97706">×11.3</tspan></text>
  <text x="76" y="370" class="s">격차: 6.2배 → <tspan class="b">2.7배</tspan> 로 좁혀짐 (규모는 Electron, 속도는 Tauri)</text>

  <!-- ② github + state of js -->
  <rect x="710" y="105" width="650" height="300" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="732" y="140" class="h">② 커뮤니티 · 실무 사용</text>
  <rect x="732" y="156" width="606" height="30" rx="6" fill="#f1f5f9"/>
  <g font-size="13" font-weight="800"><text x="746" y="176">지표</text><text x="1010" y="176" fill="#d97706">Tauri</text><text x="1180" y="176" fill="#334155">Electron</text></g>
  <g class="s">
    <text x="746" y="212">GitHub 스타</text><text x="1010" y="212">112,952</text><text x="1180" y="212">123,915</text>
    <text x="746" y="240">GitHub 포크 (직접 고쳐 쓰는 사람)</text><text x="1010" y="240">4,223</text><text x="1180" y="240">17,945</text>
    <text x="746" y="268">최신 안정 버전</text><text x="1010" y="268">2.12.5 (10-21)</text><text x="1180" y="268">45.3.3 (11-14)</text>
    <text x="746" y="296">회사에서 사용 (State of JS 2024)</text><text x="1010" y="296">488명</text><text x="1180" y="296" class="b">2,058명</text>
    <text x="746" y="324">계속 쓰고 싶다 (같은 설문)</text><text x="1010" y="324" class="b" fill="#d97706">최상위권</text><text x="1180" y="324" class="m">순위 공개 안 됨</text>
  </g>
  <g stroke="#e2e8f0"><line x1="732" y1="222" x2="1338" y2="222"/><line x1="732" y1="250" x2="1338" y2="250"/><line x1="732" y1="278" x2="1338" y2="278"/><line x1="732" y1="306" x2="1338" y2="306"/></g>
  <text x="732" y="358" class="s"><tspan class="b">해석:</tspan> 지금 회사에서 쓰는 건 Electron 이 약 4배,</text>
  <text x="732" y="382" class="s">써 본 사람 만족도와 신규 선택은 Tauri 가 앞섬</text>

  <!-- ③ fit for our project -->
  <rect x="40" y="425" width="1320" height="380" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="62" y="460" class="h">③ 우리 프로젝트 기능별로 보면</text>
  <rect x="62" y="474" width="1276" height="32" rx="6" fill="#f1f5f9"/>
  <g font-size="13.5" font-weight="800"><text x="76" y="495">필요한 것</text><text x="330" y="495" fill="#d97706">Tauri 2</text><text x="780" y="495" fill="#334155">Electron</text></g>
  <g class="s">
    <text x="76" y="534" class="b">React 화면 재사용</text><text x="330" y="534">◎ 그대로 (Vite 지원)</text><text x="780" y="534">◎ 그대로</text>
    <text x="76" y="566" class="b">앱 크기</text><text x="330" y="566">◎ 최소 600KB 미만 (공식 문서) · OS 웹뷰 사용</text><text x="780" y="566">△ Chromium + Node 포함 → 수십~100MB</text>
    <text x="76" y="598" class="b">메모리</text><text x="330" y="598">◎ 적음 (학생은 브라우저와 같이 켬)</text><text x="780" y="598">△ 창마다 Chromium</text>
    <text x="76" y="630" class="b">화면 일관성</text><text x="330" y="630">○ Windows 는 WebView2(Chromium 기반) · Mac/Linux 는 차이 가능</text><text x="780" y="630">◎ 어디서나 같은 Chromium</text>
    <text x="76" y="662" class="b">보안 기본값</text><text x="330" y="662">◎ 기능별 권한(capabilities) 허용 목록 · 릴리스마다 보안 감사</text><text x="780" y="662">○ 격리·샌드박스 기본 ON, 체크리스트 20개 직접 관리</text>
    <text x="76" y="694" class="b">로그인 딥링크 · 토큰 보관</text><text x="330" y="694">○ 공식 플러그인 (deep-link · stronghold)</text><text x="780" y="694">◎ 내장 API (protocol client · safeStorage)</text>
    <text x="76" y="726" class="b">자동 업데이트 · 알림</text><text x="330" y="726">○ 공식 플러그인 (updater: 서명 필수 · notification)</text><text x="780" y="726">◎ electron-updater 등 사례 풍부</text>
    <text x="76" y="758" class="b">우리 팀 언어</text><text x="330" y="758">△ 화면은 TS, 네이티브 기능은 Rust (기본 기능은 플러그인)</text><text x="780" y="758">◎ 전부 TypeScript</text>
    <text x="76" y="790" class="b">앞으로의 변화</text><text x="330" y="790">△ Tauri 3 알파 진행 중 (v2 로 시작 → 나중에 이전)</text><text x="780" y="790">○ 8주마다 메이저 · 최근 3개 버전 지원</text>
  </g>
  <g stroke="#e2e8f0"><line x1="62" y1="548" x2="1338" y2="548"/><line x1="62" y1="580" x2="1338" y2="580"/><line x1="62" y1="612" x2="1338" y2="612"/><line x1="62" y1="644" x2="1338" y2="644"/><line x1="62" y1="676" x2="1338" y2="676"/><line x1="62" y1="708" x2="1338" y2="708"/><line x1="62" y1="740" x2="1338" y2="740"/><line x1="62" y1="772" x2="1338" y2="772"/></g>

  <!-- ④ portfolio + decision -->
  <rect x="40" y="825" width="650" height="270" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="2"/>
  <text x="62" y="860" class="h">④ 포트폴리오 · 채용 관점</text>
  <g class="s">
    <text x="62" y="894"><tspan class="b" fill="#d97706">Tauri</tspan> — "새 기술을 근거 있게 골랐다"</text>
    <text x="80" y="918" class="m">크기·메모리·보안을 숫자로 설명 가능 · Rust 경험 한 줄 추가</text>
    <text x="80" y="938" class="m">국내 공고에선 아직 드묾 → 면접 화제성 ↑, 키워드 매칭 ↓</text>
    <text x="62" y="976"><tspan class="b">Electron</tspan> — "실무에서 바로 쓰는 기술"</text>
    <text x="80" y="1000" class="m">VS Code · Slack · Discord · Notion · ChatGPT · Claude 데스크톱</text>
    <text x="80" y="1020" class="m">채용 인력 풀이 가장 큼 → 공고 키워드 매칭 ↑, 차별점 ↓</text>
    <text x="62" y="1060" class="m">국내 데스크톱 공고 수는 숫자로 확인 못함 (원티드 등에서 직접 검색 필요)</text>
  </g>

  <rect x="710" y="825" width="650" height="270" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="732" y="860" class="h">⑤ 이렇게 고르면 됩니다</text>
  <rect x="732" y="878" width="606" height="88" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
  <text x="750" y="906" font-size="16" class="b" fill="#d97706">Tauri 2 를 고를 때</text>
  <text x="750" y="930" class="s">차별점·트렌드가 목표 · 학생 PC 대부분 Windows</text>
  <text x="750" y="952" class="s">팀에 Rust 를 조금 볼 사람 1명이 있음</text>
  <rect x="732" y="978" width="606" height="88" rx="10" fill="#fff" stroke="#475569" stroke-width="2"/>
  <text x="750" y="1006" font-size="16" class="b" fill="#334155">Electron 을 고를 때</text>
  <text x="750" y="1030" class="s">일정 안정성이 최우선 · 전원 TypeScript 로만</text>
  <text x="750" y="1052" class="s">공고 키워드(Electron) 매칭이 중요</text>
  <text x="732" y="1086" class="m">공통: React 화면은 그대로라 나중에 바꿔도 화면 코드는 재사용</text>
</svg>
