<h3>설명</h3>
<p>방장에게 받은 초대 코드로 들어간다. 들어온 사람은 그 방의 참여자(학생).</p>
<h3>주요 요소</h3>
<ol>
<li>초대 코드 6자리 칸 (헷갈리는 글자 0/O · 1/I 없음)</li>
<li>입장 버튼</li>
<li>틀린 코드: “코드에 맞는 방이 없어요”</li>
<li>닫힌 방: “이미 닫힌 방이에요”</li>
</ol>
<h3>이동</h3>
<p>입장 → 참여자 화면 ST-01</p>
